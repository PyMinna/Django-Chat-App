<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome | Chat App</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fce4ec, #e8def8);
        }

        .welcome-box {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #5b4b8a;
            margin-bottom: 10px;
        }

        p {
            color: #777;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            margin: 5px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #d16ba5, #8b6fa8);
        }

        a:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="welcome-box">

        <h1>Welcome to Chat App 💬</h1>

        <p>Connect with your friends and start chatting.</p>

        <a href="{% url 'accounts:login' %}">Login</a>

        <a href="{% url 'accounts:register' %}">Register</a>

    </div>

</body>
</html>
